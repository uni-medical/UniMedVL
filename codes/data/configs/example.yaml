# Example dataset mixture for fine-tuning UniMedVL.
# Top-level keys map to DATASET_REGISTRY / DATASET_INFO in data/dataset_info.py.
# num_used_data: samples used per dataset name; the sum must exceed
# NUM_GPUS x NUM_WORKERS.

SftJSONLIterableDataset_Ver1:            # medical image-text conversation SFT
  dataset_names:
  - medical_vqa_sft
  image_transform_args:
    image_stride: 16
    max_image_size: 1024
    min_image_size: 512
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 980
    min_image_size: 378
    max_pixels: 2_007_040
  is_mandatory: true
  shuffle_lines: True
  shuffle_seed: 42
  num_used_data:
  - 1000
  weight: 1

MedicalImageEditingIterableDataset_ver1: # interleaved medical image editing
  dataset_names:
  - medical_image_editing
  image_transform_args:
    image_stride: 16
    max_image_size: 512
    min_image_size: 224
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 518
    min_image_size: 224
  is_mandatory: true
  shuffle_lines: True
  shuffle_seed: 42
  num_used_data:
  - 1000
  weight: 1

T2IIterableDataset_Ver1:                 # medical text-to-image generation
  dataset_names:
  - medical_t2i
  image_transform_args:
    image_stride: 16
    max_image_size: 1024
    min_image_size: 512
  is_mandatory: false
  shuffle_lines: True
  shuffle_seed: 42
  num_used_data:
  - 1000
  weight: 1
